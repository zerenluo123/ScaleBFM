# @package _global_

defaults:
  - base

loader:
  _target_: scaleretarget.loader.lafan_loader.LafanLoader
  _recursive_: False
  config:
    loader_type: lafan
    data_format: .bvh
    # In multi_process mode each worker parses its own BVH (~2 s per clip in the producer otherwise).
    load_in_worker: True
