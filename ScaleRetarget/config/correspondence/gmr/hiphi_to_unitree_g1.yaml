# HiPHI version of soma_to_unitree_g1.yaml: same links, weights, scale table and limb position offsets.
# HiphiLoader rescales each motion limb by limb to the SOMA Uniform proportions, so the SOMA scale table
# applies unchanged; bone names, rotation offsets and the torso position offset differ.
# Torso: Spine2 (lower thoracic). Of the five HiPHI spine bones it follows the trunk (hips -> shoulders) the way
# SOMA Chest does when bending, side-bending and twisting; Spine4, the parent of neck and shoulders, also turns
# with the shoulder blades (lifting the arms, shrugging), so its torso target leaned back past the G1-D waist
# limit on 1 in 5 frames. Its rotation offset is the rest-pose one pitched forward so that on walking motions
# the target leans ahead of the trunk line (mid hip joints -> mid shoulders, not Hips, which sits ~8 cm higher
# and ~3 cm further back on SOMA) by as much as with SOMA Chest; its position offset puts the target where it
# is relative to the shoulder targets with SOMA. Both from scripts/hiphi/calibrate_offsets.py.
# Rotation offsets: Hips from the HiPHI rest pose, an upright T-pose with every bone frame equal to the world
# frame. Upper arm / forearm (thigh / shin) align the bone direction and the measured elbow (knee)
# flexion axis with the robot's link direction and hinge axis, times the small constant rotation by which
# NVIDIA's SOMA offsets differ from the same construction on SOMA (7-11 deg for the arms, < 1 deg for the
# legs). Wrists and ankles: the HiPHI rest pose (hand straight on the forearm, foot flat) is the robot with
# those joints at zero.
# HiphiLoader moves the forearm twist into the hand, as in SOMA, so the forearm follows the elbow hinge.
robot_root_name: pelvis
human_root_name: Hips
ground_height: 0.0
human_height_assumption: 1.8 # unused: HiphiLoader passes no height, it rescales every skeleton to SOMA Uniform

