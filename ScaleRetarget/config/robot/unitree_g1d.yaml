# @package _global_

robot:
  robot_type: unitree_g1d

  robot_xml_path: assets/unitree_g1d/g1d_mocap.xml

  robot_base: torso_link

  viewer_cam_dist: 2.5

  # SMPL-X loaders fit the body shape to a robot's rest pose. G1-D has the G1 upper body and no legs,
  # so the shape is fitted to the G1; the root keeps the clip's own height (root_keeps_human_scale).
  smplx_shape_robot:
    robot_type: unitree_g1
    robot_xml_path: assets/unitree_g1/g1_mocap_29dof.xml

  # The whole human is shifted vertically so the root height follows a low-passed, speed-limited
  # curve the lift can track. max_speed is the column limit in unitree_sdk2 (AgvClient::HeightAdjust,
  # 76.5 mm/s); the URDF allows 0.05 m/s per stage and the product page says about 60 mm/s.
  root_height_filter:
    cutoff_hz: 2.0
    max_speed: 0.0765

  # The chassis is a differential drive. A path is planned for the chassis origin: 1 Hz low-passed,
  # keeping only the motion along a heading that is the smoothed pelvis direction turned no faster than
  # max_turn_rate. Like the lift, the whole human is moved onto it (shifted, and turned about the root).
  # The planned x, y, yaw are written straight into the chassis joints and locked in the IK: when the IK
  # solved them, it turned the chassis off the heading to reach the hands and the chassis slid sideways
  # in its own frame (LAFAN v1: 1.4 m/s). Limits are from unitree_sdk2 (AgvClient::Move: 1.5 m/s,
  # 0.6 rad/s, no lateral velocity).
  base_path_filter:
    cutoff_hz: 1.0
    max_speed: 1.5
    max_turn_rate: 0.6

  # Hard per-frame bound on the summed lift motion in the IK; without it the solver still uses the
  # lift to reach hand targets (e.g. arms overhead) even when the root target is smooth.
  lift_speed_limit:
    joints: [LZ_mt_Joint, LZ_it_Joint]
    max_speed: ${robot.root_height_filter.max_speed}
